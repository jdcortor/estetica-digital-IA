<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Streaming - Capacitación de Estética</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --header-dark: #222121;
            --header-yellow: #fbd008;
            --header-yellow-hover: #e5bd00;
            --bg-dark: #121214;
            --panel-bg: #1e1e22;
            --panel-bg-glass: rgba(30, 30, 34, 0.75);
            --text-white: #ffffff;
            --text-muted: #a0a0ab;
            --border-color: #3f3f46;
            --font-main: 'Montserrat', sans-serif;
            --font-labels: 'Nunito', sans-serif;
            
            /* Colores de las Técnicas */
            --comp-purple: #6c53a3;
            --maq-blue: #30a0e0;
            --diario-pink: #f4629e;
            --crochet-green: #5cc472;
            
            --success-color: #22c55e;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: var(--font-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #121214;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--header-yellow);
        }

        /* --- BARRA SUPERIOR (TOP BAR) --- */
        .top-bar {
            height: 65px;
            background-color: var(--header-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            z-index: 10;
            border-bottom: 3px solid var(--header-yellow);
            flex-shrink: 0;
        }

        .title-container h1 {
            color: #ffffff;
            font-family: var(--font-labels);
            font-size: 22px;
            margin: 0;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .title-container h1 span {
            color: var(--header-yellow);
        }

        .title-container p {
            color: var(--text-muted);
            font-size: 11px;
            margin-top: 2px;
        }

        .actions-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .close-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            text-decoration: none;
            font-family: var(--font-main);
            font-weight: 600;
            font-size: 14px;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .close-btn:hover {
            background-color: var(--danger-color);
            border-color: var(--danger-color);
            transform: scale(1.03);
        }

        /* --- CONTENEDOR PRINCIPAL (WORKSPACE) --- */
        .workspace {
            flex: 1;
            width: 100%;
            display: grid;
            grid-template-columns: 300px 1fr 380px;
            overflow: hidden;
            background-color: #16161a;
        }

        /* --- COLUMNA 1: CANALES Y AGENDA (IZQUIERDA) --- */
        .left-section {
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .section-title {
            font-family: var(--font-labels);
            font-size: 12px;
            font-weight: 800;
            color: var(--header-yellow);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .channels-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .channel-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .channel-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--header-yellow);
        }

        .channel-card.active {
            background: rgba(251, 208, 8, 0.08);
            border-color: var(--header-yellow);
            box-shadow: 0 0 10px rgba(251, 208, 8, 0.15);
        }

        .channel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .channel-badge {
            background: var(--danger-color);
            color: white;
            font-size: 8px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .channel-title {
            font-family: var(--font-labels);
            font-size: 13.5px;
            font-weight: 700;
            color: #ffffff;
        }

        .channel-desc {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .channel-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .channel-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .channel-meta .viewers-count {
            color: var(--success-color);
        }

        /* Próximas Sesiones */
        .agenda-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .agenda-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .agenda-time {
            font-family: var(--font-labels);
            font-size: 10.5px;
            font-weight: 800;
            color: var(--header-yellow);
        }

        .agenda-title {
            font-family: var(--font-main);
            font-size: 12px;
            font-weight: 600;
        }

        .agenda-teacher {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-reminder {
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed var(--border-color);
            color: #ffffff;
            font-size: 10.5px;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.2s ease;
            text-align: center;
            font-weight: 600;
        }

        .btn-reminder:hover {
            background: rgba(251, 208, 8, 0.1);
            border-color: var(--header-yellow);
            color: var(--header-yellow);
        }

        .btn-reminder.active {
            background: var(--success-color);
            color: white;
            border-style: solid;
            border-color: var(--success-color);
        }

        /* --- COLUMNA 2: REPRODUCTOR DE VIDEO (CENTRO) --- */
        .center-section {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            position: relative;
        }

        .video-player-wrapper {
            position: relative;
            width: 100%;
            background-color: #000;
            border-radius: 14px;
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            aspect-ratio: 16/9;
        }

        .video-player-wrapper.active-border {
            border-color: var(--header-yellow);
        }

        .video-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Overlay de Reacciones Flotantes */
        .reactions-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none; /* Dejar pasar clics */
            z-index: 5;
            overflow: hidden;
        }

        .emoji-bubble {
            position: absolute;
            bottom: -50px;
            font-size: 28px;
            animation: floatEmoji 4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            opacity: 0.9;
        }

        @keyframes floatEmoji {
            0% {
                transform: translateY(0) translateX(0) scale(0.6);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translateY(-50px) translateX(var(--drift-1)) scale(1.1);
            }
            50% {
                transform: translateY(-200px) translateX(var(--drift-2)) scale(1);
            }
            100% {
                transform: translateY(-450px) translateX(var(--drift-3)) scale(0.8);
                opacity: 0;
            }
        }

        /* Información del Video */
        .video-info {
            background: rgba(30, 30, 34, 0.6);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .live-status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .live-label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-badge {
            background: var(--danger-color);
            color: #fff;
            font-family: var(--font-labels);
            font-size: 11px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 6px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .live-indicator-dot {
            width: 7px;
            height: 7px;
            background-color: white;
            border-radius: 50%;
            animation: pulse 1.2s infinite;
        }

        .viewer-badge {
            background: rgba(0, 0, 0, 0.4);
            color: var(--text-muted);
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .viewer-badge strong {
            color: var(--success-color);
        }

        .video-title {
            font-family: var(--font-labels);
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.3;
        }

        .video-teacher-card {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 5px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .teacher-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--header-yellow);
            color: var(--header-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-labels);
            font-weight: 800;
            font-size: 13px;
            box-shadow: 0 2px 6px rgba(251, 208, 8, 0.3);
        }

        .teacher-meta-text {
            display: flex;
            flex-direction: column;
        }

        .teacher-name {
            font-size: 12.5px;
            font-weight: 700;
            color: #ffffff;
        }

        .teacher-role {
            font-size: 10.5px;
            color: var(--text-muted);
        }

        /* --- COLUMNA 3: CHAT EN VIVO (DERECHA) --- */
        .right-section {
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
        }

        .chat-header {
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.25);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-header h3 {
            font-family: var(--font-labels);
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .chat-online-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success-color);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--success-color);
        }

        .chat-clear-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            transition: color 0.2s ease;
        }

        .chat-clear-btn:hover {
            color: var(--header-yellow);
        }

        /* Mensajes del Chat */
        .chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(18, 18, 20, 0.25);
        }

        .chat-msg {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.02);
            max-width: 95%;
            align-self: flex-start;
            animation: messageFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes messageFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-msg.moderator {
            background: rgba(251, 208, 8, 0.05);
            border-left: 3px solid var(--header-yellow);
            border-color: rgba(251, 208, 8, 0.15) rgba(251, 208, 8, 0.15) rgba(251, 208, 8, 0.15) var(--header-yellow);
        }

        .chat-msg.student-user {
            background: rgba(108, 83, 163, 0.08);
            border-right: 3px solid var(--comp-purple);
            border-color: rgba(108, 83, 163, 0.15) var(--comp-purple) rgba(108, 83, 163, 0.15) rgba(108, 83, 163, 0.15);
            align-self: flex-end;
        }

        .chat-msg-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .chat-msg-author {
            font-size: 11px;
            font-weight: 700;
            font-family: var(--font-labels);
        }

        .chat-msg-author.mod-name {
            color: var(--header-yellow);
        }

        .chat-msg-author.student-name {
            color: var(--maq-blue);
        }

        .chat-msg-author.user-name {
            color: #d8b4fe;
        }

        .chat-msg-tag {
            font-size: 8px;
            font-weight: 800;
            padding: 1.5px 5px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .chat-msg-tag.tag-mod {
            background: var(--header-yellow);
            color: var(--header-dark);
        }

        .chat-msg-tag.tag-user {
            background: var(--comp-purple);
            color: #ffffff;
        }

        .chat-msg-content {
            font-size: 12.5px;
            line-height: 1.45;
            color: #e4e4e7;
            word-break: break-word;
        }

        /* Area de entrada de texto */
        .chat-input-area {
            padding: 15px;
            background: rgba(0, 0, 0, 0.25);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }

        .quick-reactions-row {
            display: flex;
            gap: 8px;
            justify-content: space-between;
            align-items: center;
        }

        .reaction-btn {
            flex: 1;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            padding: 6px 0;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reaction-btn:hover {
            background: rgba(251, 208, 8, 0.1);
            border-color: var(--header-yellow);
            transform: scale(1.08);
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .chat-text-input {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            color: #ffffff;
            font-family: var(--font-main);
            font-size: 13px;
            padding: 10px 12px;
            transition: all 0.3s ease;
        }

        .chat-text-input:focus {
            outline: none;
            border-color: var(--header-yellow);
            box-shadow: 0 0 6px rgba(251, 208, 8, 0.2);
        }

        .chat-send-btn {
            background: var(--header-yellow);
            color: var(--header-dark);
            border: none;
            border-radius: 8px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .chat-send-btn:hover {
            background: var(--header-yellow-hover);
            transform: scale(1.03);
        }

        /* --- INTERFAZ DEL POPUP MODAL (EFECTO LIBRO 3D) --- */
        .addie-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            perspective: 2000px;
        }

        .addie-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .addie-modal-container {
            width: 85%;
            height: 85%;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: rotateY(-90deg);
            transform-origin: left center;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .addie-modal-overlay.active .addie-modal-container {
            transform: rotateY(0deg);
        }

        .addie-modal-header {
            background: var(--header-dark);
            color: #ffffff;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--header-yellow);
        }

        .addie-modal-header h3 {
            margin: 0;
            font-family: var(--font-labels);
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        .addie-close-x {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 32px;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s, transform 0.2s;
        }

        .addie-close-x:hover {
            color: #ff4d4d;
            transform: scale(1.1);
        }

        .addie-modal-body {
            flex: 1;
            background: #525659;
            position: relative;
        }

        .addie-modal-body iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .poll-opt-btn:hover {
            background: rgba(255,255,255,0.12) !important;
            border-color: var(--header-yellow) !important;
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="title-container">
            <h1>Aula Virtual <span>Streaming Estética</span></h1>
            <p>Capacitación y Clases en Vivo · Colegio Danilo Cifuentes · Grado 11</p>
        </div>
        
        <div class="actions-container">
            <button onclick="openAddieModal()" class="close-btn" style="background-color: var(--comp-purple); border-color: var(--comp-purple);">
                <i class="fa-solid fa-pen-ruler"></i> Diseño de Recurso
            </button>
            <button class="close-btn" onclick="volverAlMapa()">
                <i class="fa-solid fa-arrow-left"></i> Volver al Mapa
            </button>
        </div>
    </div>

    <!-- WORKSPACE -->
    <div class="workspace">
        
        <!-- COLUMNA 1: CANALES Y AGENDA (IZQUIERDA) -->
        <div class="left-section">
            <div>
                <div class="section-title">
                    <i class="fa-solid fa-tower-broadcast"></i> En Vivo Ahora
                </div>
                <div class="channels-list" id="channels-container">
                    <!-- Canales cargados dinámicamente -->
                </div>
            </div>

            <div style="margin-top: 10px;">
                <div class="section-title">
                    <i class="fa-regular fa-calendar-days"></i> Próximas Sesiones
                </div>
                <div class="agenda-list" id="agenda-container">
                    <!-- Clases programadas cargadas dinámicamente -->
                </div>
            </div>
        </div>

        <!-- COLUMNA 2: REPRODUCTOR DE VIDEO (CENTRO) -->
        <div class="center-section">
            <div class="video-player-wrapper" id="video-player-container">
                <!-- Capa flotante de reacciones -->
                <div class="reactions-overlay" id="reactions-space"></div>
                
                <!-- Selector flotante de fuente de video (Local / YouTube) -->
                <div class="player-mode-selector" style="position: absolute; top: 15px; right: 15px; z-index: 20; display: flex; gap: 6px; background: rgba(0,0,0,0.75); padding: 4px 6px; border-radius: 20px; border: 1.5px solid var(--border-color); backdrop-filter: blur(5px);">
                    <button id="mode-local-btn" onclick="setPlayerMode('local')" style="background: none; border: none; color: var(--text-muted); font-size: 10px; font-weight: 700; font-family: var(--font-main); padding: 4px 10px; border-radius: 12px; cursor: pointer; transition: all 0.2s;">LOCAL</button>
                    <button id="mode-youtube-btn" onclick="setPlayerMode('youtube')" style="background: none; border: none; color: var(--text-muted); font-size: 10px; font-weight: 700; font-family: var(--font-main); padding: 4px 10px; border-radius: 12px; cursor: pointer; transition: all 0.2s;">STREAMING</button>
                </div>
                
                <!-- Area del reproductor interactivo -->
                <div id="player-media-content" style="width: 100%; height: 100%;">

            document.querySelectorAll('.channel-card').forEach(card => card.classList.remove('active'));

            if (activeCard) activeCard.classList.add('active');

            actualizarReproductor();

            // Efecto flash dorado temporal al borde del reproductor

        // --- 6. SIMULACIÓN DEL CHAT EN VIVO ---
        function iniciarChatInfinito() {
            // Lanzar un mensaje inicial rápido a los 2 segundos
            chatTimeout = setTimeout(generarMensajeSimulado, 2000);

            // Programar intervalo regular (cada 4 a 7 segundos)
            chatInterval = setInterval(generarMensajeSimulado, 5000);
        }

        async function generarMensajeSimulado() {
            const channel = channelsData.find(c => c.id === currentChannelId);
            if (!channel) return;

            // Variar ligeramente espectadores
            const currentViewers = parseInt(document.getElementById('viewer-count-val').textContent);
            const variation = Math.floor(Math.random() * 7) - 3; // de -3 a +3
            const limitViewers = Math.max(channel.viewersMin, Math.min(channel.viewersMax, currentViewers + variation));
            document.getElementById('viewer-count-val').textContent = limitViewers;
            
            const chViewersText = document.getElementById(`ch-viewers-${channel.id}`);
            if (chViewersText) chViewersText.textContent = limitViewers;

            // Encuesta ocasional (12% de las veces) por parte del Moderador
            if (Math.random() < 0.12) {
                lanzarEncuestaInteractiva();
                return;
            }

            // Elegir participante aleatorio
            const name = channel.participants[Math.floor(Math.random() * channel.participants.length)];
            const apiKey = "AIzaSyASH7YE9JGwJ2k3k-6yZ1flYLv_c3_4gaQ";

            // Intentar generar respuesta con Gemini
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
                const payload = {
                    contents: [{
                        role: "user",
                        parts: [{
                            text: `Eres un estudiante de grado 11 de un colegio en Colombia llamado ${name}. Estás viendo una clase virtual sobre "${channel.title}". Escribe un comentario corto para el chat en vivo (1 o 2 oraciones breves). Sé muy natural, usa expresiones escolares de Colombia ("profe", "bacano", "uy", "qué nota", "súper"), comenta y reacciona sobre la clase. No uses hashtags ni comillas.`
                        }]
                    }]
                };

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const data = await response.json();
                    let text = data.candidates[0].content.parts[0].text.trim();
                    insertarMensajeChat(name, text, false, false);
                } else {
                    const text = channel.phrases[Math.floor(Math.random() * channel.phrases.length)];
                    insertarMensajeChat(name, text, false, false);
                }
            } catch (e) {
                const text = channel.phrases[Math.floor(Math.random() * channel.phrases.length)];
                insertarMensajeChat(name, text, false, false);
            }

            // Lanzar reacción flotante aleatoria en la pantalla (30% de probabilidad)
            if (Math.random() < 0.3) {
                const emojis = ['👏', '❤️', '💡', '😮', '🔥'];
                const emoji = emojis[Math.floor(Math.random() * emojis.length)];
                lanzarEmoji(emoji, true);
            }

        function insertarMensajeChat(author, text, isMod = false, isUser = false) {
            const container = document.getElementById('chat-history-container');
            const row = document.createElement('div');

            row.style.gap = "10px";
            row.style.marginBottom = "8px";

            let tagHtml = '';
            
            let avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(author)}&background=random&color=fff&bold=true`;

            if (isMod) {
                typeClass = 'moderator';
                authorClass = 'mod-name';
                tagHtml = `<span class="chat-msg-tag tag-mod">Moderador</span>`;
                avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(author)}&background=fbd008&color=222121&bold=true`;
            } else if (isUser) {
                typeClass = 'student-user';
                authorClass = 'user-name';
                tagHtml = `<span class="chat-msg-tag tag-user">Tú</span>`;
                row.style.flexDirection = "row-reverse";

        async function generarRespuestaEcosistema(userText) {
            const channel = channelsData.find(c => c.id === currentChannelId);
            if (!channel) return;

            // Decidir quién responde (70% un estudiante aleatorio, 30% el docente/moderador)

            let isModResponse = true;
            let personaPrompt = `Eres la Profesora/Moderador de Clase ${channel.teacher}. Un estudiante llamado ${studentSessionName} en el chat en vivo acaba de comentar/preguntar: "${userText}". Responde a su comentario en tono docente, cálido, motivador y claro en el contexto de tu clase virtual "${channel.title}". Sé conciso y responde en 1 o 2 frases breves. No uses hashtags ni comillas en tu respuesta.`;

            if (Math.random() < 0.7) {
                responder = channel.participants[Math.floor(Math.random() * channel.participants.length)];
                isModResponse = false;
                personaPrompt = `Eres un estudiante de grado 11 de un colegio en Colombia llamado ${responder}. Tu compañero de clase ${studentSessionName} acaba de escribir en el chat en vivo: "${userText}". Responde a su comentario de manera muy amigable, corta (1 frase) y natural en el contexto de la clase virtual "${channel.title}". Usa jerga escolar colombiana de forma natural y respetuosa ("uy parce", "bacano", "qué nota", "súper de acuerdo", "total"). No uses hashtags ni comillas en tu respuesta.`;
            }

            const apiKey = "AIzaSyASH7YE9JGwJ2k3k-6yZ1flYLv_c3_4gaQ";
            
            // Simular retraso de escritura
            setTimeout(async () => {
                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
                    const payload = {
                        contents: [{
                            role: "user",
                            parts: [{ text: personaPrompt }]
                        }]
                    };

                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        const data = await response.json();
                        let text = data.candidates[0].content.parts[0].text.trim();
                        insertarMensajeChat(responder, text, isModResponse, false);
                    } else {
                        fallbackRespuestaEcosistema(userText, responder, isModResponse);
                    }
                } catch (e) {
                    fallbackRespuestaEcosistema(userText, responder, isModResponse);
                }
            }, 1500);
        }

        function fallbackRespuestaEcosistema(userText, responder, isModResponse) {
            const channel = channelsData.find(c => c.id === currentChannelId);
            if (!channel) return;
            const textLower = userText.toLowerCase();

            if (textLower.includes("hola") || textLower.includes("buenas") || textLower.includes("saludos")) {
                responseText = `¡Hola, ${studentSessionName}! Qué gusto tenerte en la transmisión. ¿Cómo va tu proyecto de Estética?`;
            } 
            else if (textLower.includes("portafolio") || textLower.includes("fase") || textLower.includes("entregable")) {
                responseText = `Justamente estamos analizando los portafolios, ${studentSessionName}. Acuérdate que debemos enlazar la bitácora y la ficha de IAs en la entrega.`;
            } 
            else if (textLower.includes("nota") || textLower.includes("evaluar") || textLower.includes("rúbrica") || textLower.includes("criterio")) {
                responseText = `Hola ${studentSessionName}. La evaluación es continua mediante la Bitácora Digital. Revísate la rúbrica interactiva para asegurar tu nota.`;
            } 
            else {
                const genericResponses = [
                    `Excelente punto, ${studentSessionName}. Eso aporta muchísimo a la discusión de esta clase.`,
                    `Muy de acuerdo con lo que comentas. ¿Alguien más tiene una postura diferente en el grupo?`,
                    `¡Gracias por participar en el chat, ${studentSessionName}! Sigamos prestando atención a esta sección del video.`,
                    `Exacto. La idea es que apliquemos estos conceptos de estética en el diseño de su propio portafolio digital.`
                ];
                responseText = genericResponses[Math.floor(Math.random() * genericResponses.length)];
            }
            insertarMensajeChat(responder, responseText, isModResponse, false);
        }

        // --- 7.5 SISTEMA DE ENCUESTAS INTERACTIVAS (POLLS) ---
        function lanzarEncuestaInteractiva() {
            const channel = channelsData.find(c => c.id === currentChannelId);
            if (!channel) return;

            const encuestas = [
                {
                    pregunta: "¿Qué herramienta de diseño prefieren usar para su portafolio?",
                    opciones: ["Illustrator", "Canva", "Figma"]
                },
                {
                    pregunta: "¿Cómo van con la redacción del acuerdo ético de IAs?",
                    opciones: ["Ya lo firmé ✅", "Apenas redactando ⏳", "No sé qué es 😵"]
                },
                {
                    pregunta: "¿Qué herramienta de Inteligencia Artificial les ha parecido más útil?",
                    opciones: ["ChatGPT / Gemini 🤖", "Midjourney / DALL-E 🎨", "Suno / v0 💡"]
                }
            ];

            const encuesta = encuestas[Math.floor(Math.random() * encuestas.length)];
            insertarEncuestaChat(channel.teacher, encuesta.pregunta, encuesta.opciones);
        }

        function insertarEncuestaChat(author, pregunta, opciones) {
            const container = document.getElementById('chat-history-container');
            const row = document.createElement('div');
            row.style.display = "flex";
            row.style.gap = "10px";
            row.style.marginBottom = "12px";
            row.style.alignItems = "flex-start";
            
            const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(author)}&background=fbd008&color=222121&bold=true`;
            const pollId = 'poll-' + Date.now();

            let optionsHtml = '';
            opciones.forEach((opc, idx) => {
                optionsHtml += `
                    <button class="poll-opt-btn" onclick="votarEncuesta('${pollId}', ${idx})" style="width: 100%; background: rgba(255,255,255,0.06); border: 1.5px solid var(--border-color); color: #fff; border-radius: 6px; padding: 8px 10px; margin-top: 6px; text-align: left; font-size: 11.5px; cursor: pointer; transition: all 0.2s; font-family: var(--font-main); font-weight: 500;">
                        ${opc}
                    </button>
                `;
            });

            row.innerHTML = `
                <img src="${avatarUrl}" style="width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.2);" alt="Avatar">
                <div class="chat-msg moderator" id="${pollId}" style="animation: messageFadeIn 0.3s ease; margin: 0; max-width: 85%; background: rgba(251, 208, 8, 0.08); border-left: 3px solid var(--header-yellow); border-color: rgba(251, 208, 8, 0.15) rgba(251, 208, 8, 0.15) rgba(251, 208, 8, 0.15) var(--header-yellow); padding: 12px; width: 100%;">
                    <div class="chat-msg-meta" style="margin-bottom: 5px;">
                        <span class="chat-msg-author mod-name" style="color: var(--header-yellow); font-weight: 800; font-size: 11px;">${author}</span>
                        <span class="chat-msg-tag tag-mod" style="background: var(--header-yellow); color: var(--header-dark); font-size: 8px; font-weight: 800; padding: 1.5px 5px; border-radius: 3px; text-transform: uppercase;">ENCUESTA</span>
                    </div>
                    <div class="chat-msg-content" style="font-size: 12.5px; font-weight: 600; color: #fff; line-height: 1.4;">${pregunta}</div>
                    <div class="poll-options-container" style="margin-top: 5px; display: flex; flex-direction: column; gap: 4px;">
                        ${optionsHtml}
                    </div>
                </div>
            `;

            container.appendChild(row);
            container.scrollTop = container.scrollHeight;
        }

        function votarEncuesta(pollId, selectedIdx) {
            const pollBox = document.getElementById(pollId);
            if (!pollBox) return;

            const optButtons = pollBox.querySelectorAll('.poll-opt-btn');
            
            // Generar porcentajes ficticios que sumen 100%
            let numOptions = optButtons.length;
            let percentages = [];
            let sum = 0;
            
            for (let i = 0; i < numOptions; i++) {
                let randomVal = Math.floor(Math.random() * 50) + 15;
                percentages.push(randomVal);
                sum += randomVal;
            }
            
            percentages = percentages.map(val => Math.round((val / sum) * 100));
            let normSum = percentages.reduce((a, b) => a + b, 0);
            if (normSum !== 100) {
                percentages[0] += (100 - normSum);
            }

            optButtons.forEach((btn, idx) => {
                btn.disabled = true;
                btn.onclick = null;
                
                const percent = percentages[idx];
                const isSelected = (idx === selectedIdx);
                
                btn.style.position = 'relative';
                btn.style.overflow = 'hidden';
                btn.style.cursor = 'default';
                btn.style.background = 'rgba(255, 255, 255, 0.03)';
                if (isSelected) {
                    btn.style.borderColor = 'var(--header-yellow)';
                }
                
                btn.innerHTML = `
                    <div class="poll-bar" style="position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: ${isSelected ? 'rgba(251, 208, 8, 0.15)' : 'rgba(255,255,255,0.06)'}; transition: width 1s cubic-bezier(0.1, 0.8, 0.3, 1); z-index: 1;"></div>
                    <div style="position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; width: 100%;">
                        <span>${btn.innerText} ${isSelected ? ' 🌟' : ''}</span>
                        <strong style="color: ${isSelected ? 'var(--header-yellow)' : '#fff'}">${percent}%</strong>
                    </div>
                `;
                
                setTimeout(() => {
                    const bar = btn.querySelector('.poll-bar');
                    if (bar) bar.style.width = `${percent}%`;
                }, 50);
            });

            setTimeout(() => {
                const channel = channelsData.find(c => c.id === currentChannelId);
                if (!channel) return;
                
                const commenter = channel.participants[Math.floor(Math.random() * channel.participants.length)];
                const comments = [
                    "¡Uy profe, yo también voté por esa opción!",
                    "Totalmente de acuerdo con el porcentaje de la encuesta.",
                    "¡Esa pregunta estuvo capciosa, profe! Jaja.",
                    "Qué bien ver lo que opina la mayoría del salón."
                ];
                insertarMensajeChat(commenter, comments[Math.floor(Math.random() * comments.length)], false, false);
            }, 2500);
        }

        // --- 8. ANIMACIÓN DE REACCIONES FLOTANTES (EMOJIS) ---
        function lanzarEmoji(emoji, isAuto = false) {
            const space = document.getElementById('reactions-space');
            const bubble = document.createElement('span');
            bubble.className = 'emoji-bubble';
            bubble.textContent = emoji;

            // Posición horizontal aleatoria (dentro de la pantalla de video)
            const leftOffset = Math.floor(Math.random() * 80) + 10; // de 10% a 90%
            bubble.style.left = `${leftOffset}%`;

            // Variaciones aleatorias para la animación (drifting)
            const drift1 = `${Math.floor(Math.random() * 60) - 30}px`;
            const drift2 = `${Math.floor(Math.random() * 80) - 40}px`;
            const drift3 = `${Math.floor(Math.random() * 100) - 50}px`;
            
            bubble.style.setProperty('--drift-1', drift1);
            bubble.style.setProperty('--drift-2', drift2);
            bubble.style.setProperty('--drift-3', drift3);

            space.appendChild(bubble);

            // Eliminar del DOM después de terminar la animación (4 segundos)
            setTimeout(() => {
                bubble.remove();
            }, 4000);

            // Si el usuario hace clic, agregamos un mensaje simbólico al chat (opcional)
            if (!isAuto) {
                // Registrar reacción en el chat con probabilidad
                if (Math.random() < 0.4) {
                    setTimeout(() => {
                        insertarMensajeChat(studentSessionName, `reaccionó con un ${emoji}`, false, true);
                    }, 500);
                }
            }
        }

        // --- 9. NAVEGACIÓN ---
        function volverAlMapa() {
            window.location.href = "../index.html";
        }

        // --- 10. FUNCIONES DEL MODAL DE DISEÑO DE RECURSO ---
        function openAddieModal() {
            document.getElementById('addie-modal-overlay').classList.add('active');
        }

        function closeAddieModal() {
            document.getElementById('addie-modal-overlay').classList.remove('active');
        }

        function closeAddieModalOnOverlay(event) {
            if (event.target.id === 'addie-modal-overlay') {
                closeAddieModal();
            }
        }
    </script>

    <!-- Popup Modal para desplegar diseno_recurso_capacitar.html -->
    <div id="addie-modal-overlay" class="addie-modal-overlay" onclick="closeAddieModalOnOverlay(event)">
        <div class="addie-modal-container">
            <div class="addie-modal-header">
                <h3>📖 Desarrollo Curricular - Diseño de Recurso</h3>
                <button class="addie-close-x" onclick="closeAddieModal()">&times;</button>
            </div>
            <div class="addie-modal-body">
                <iframe src="diseno_recurso_capacitar.html"></iframe>
            </div>
        </div>
    </div>
