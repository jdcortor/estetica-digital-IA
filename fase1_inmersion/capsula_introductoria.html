<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recorrido Virtual - Galería Metropolitana</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --header-dark: #222121;
            --header-yellow: #fbd008;
            --font-main: 'Montserrat', sans-serif;
            --font-labels: 'Nunito', sans-serif;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: var(--font-main);
            background-color: #e5e7eb;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        /* --- BARRA SUPERIOR --- */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 65px;
            background-color: var(--header-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            z-index: 20;
            border-bottom: 3px solid var(--header-yellow);
            box-sizing: border-box;
        }

        .title-container h1 {
            color: #ffffff;
            font-family: var(--font-labels);
            font-size: 24px;
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-container h1 span {
            color: var(--header-yellow);
        }

        .actions-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .close-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background-color: #ff4d4d;
            border-color: #ff4d4d;
            transform: scale(1.05);
        }

        /* MAPA DE NAVEGACIÓN RÁPIDA (ROADMAP) */
        #quick-navigation-map {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(34, 33, 33, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            z-index: 100;
        }
        .map-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-family: var(--font-labels);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .map-btn[data-index="0"] {
            width: auto;
            padding: 0 15px;
            border-radius: 20px;
        }
        .map-btn:hover {
            background: var(--header-yellow);
            color: var(--header-dark);
            border-color: var(--header-yellow);
            box-shadow: 0 0 10px rgba(251, 208, 8, 0.5);
            transform: scale(1.1);
        }
        .map-btn.active {
            background: var(--header-yellow);
            color: var(--header-dark);
            border-color: var(--header-yellow);
            box-shadow: 0 0 15px rgba(251, 208, 8, 0.8);
            transform: scale(1.05);
        }

        /* INTERFAZ DEL TOUR */
        #ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        .nav-btn {
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 600;
            background-color: #ffffff;
            color: #1f2937;
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            font-family: var(--font-main);
        }
        .nav-btn:hover {
            background-color: #111827;
            color: white;
            transform: translateY(-2px);
        }
        .nav-btn:disabled {
            background-color: #f3f4f6;
            color: #9ca3af;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        #info-panel {
            position: absolute;
            top: 90px;
            left: 30px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            color: #1f2937;
            padding: 25px;
            border-radius: 20px;
            max-width: 340px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.05);
            z-index: 10;
            opacity: 1;
            transition: opacity 1s ease;
        }
        h2 { margin: 0 0 10px 0; font-size: 22px; color: #111827; font-weight: 700; font-family: var(--font-labels); }
        p { margin: 0; line-height: 1.6; color: #4b5563; font-size: 14.5px; }
        #counter { font-size: 11px; color: #9ca3af; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 1.5px; font-weight: 600; font-family: var(--font-labels); }

        /* Botón para abrir Diseño de Recurso */
        .addie-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--header-dark);
            text-decoration: none;
            font-family: var(--font-main);
            font-weight: 700;
            font-size: 15px;
            background-color: var(--header-yellow);
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(251, 208, 8, 0.3);
        }

        .addie-btn:hover {
            background-color: #e5bd00;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(251, 208, 8, 0.5);
        }

        /* --- INTERFAZ DEL POPUP MODAL (EFECTO LIBRO 3D) --- */
        .addie-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            perspective: 2000px;
        }

        .addie-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .addie-modal-container {
            width: 85%;
            height: 85%;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: rotateY(-90deg);
            transform-origin: left center;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .addie-modal-overlay.active .addie-modal-container {
            transform: rotateY(0deg);
        }

        .addie-modal-header {
            background: var(--header-dark);
            color: #ffffff;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--header-yellow);
        }

        .addie-modal-header h3 {
            margin: 0;
            font-family: var(--font-labels);
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        .addie-close-x {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 32px;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s, transform 0.2s;
        }

        .addie-close-x:hover {
            color: #ff4d4d;
            transform: scale(1.1);
        }

        .addie-modal-body {
            flex: 1;
            background: #525659;
            position: relative;
        }

        .addie-modal-body iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- BOCADILLO DE DIÁLOGO INTERACTIVO (COMIC STYLE) --- */
        #speech-bubble {
            position: absolute;
            bottom: 40px;
            right: 40px;
            background: #ffffff;
            border: 3px solid #222121;
            color: #1f2937;
            padding: 25px;
            border-radius: 20px;
            width: 380px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.18);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.15);
            transform: translateY(20px) scale(0.95);
            box-sizing: border-box;
        }
        #speech-bubble.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }
        #speech-bubble::after {
            content: '';
            position: absolute;
            left: -15px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 15px 15px 15px 0;
            border-style: solid;
            border-color: transparent #222121 transparent transparent;
            display: block;
            width: 0;
        }
        #speech-bubble::before {
            content: '';
            position: absolute;
            left: -11px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 13px 13px 13px 0;
            border-style: solid;
            border-color: transparent #ffffff transparent transparent;
            display: block;
            width: 0;
            z-index: 1;
        }
        #close-speech-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.05);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4b5563;
            transition: all 0.2s ease;
            line-height: 1;
        }
        #close-speech-btn:hover {
            background: #ff4d4d;
            color: white;
            transform: scale(1.05);
        }
        #speech-category {
            font-size: 10px;
            color: #222121;
            background: #fbd008;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
            font-family: var(--font-labels);
            display: inline-block;
            margin-bottom: 12px;
        }
        #speech-title {
            display: none;
        }
        #speech-text {
            margin: 0;
            line-height: 1.6;
            color: #4b5563;
            font-size: 14.5px;
            min-height: 80px;
        }
        #speech-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
        }
        .speech-action-btn {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid #d1d5db;
            background: white;
            color: #374151;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-main);
        }
        .speech-action-btn:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }
        .speech-action-btn.highlighted {
            background: #222121;
            color: #ffffff;
            border-color: #222121;
        }
        .speech-action-btn.highlighted:hover {
            background: #fbd008;
            color: #222121;
            border-color: #fbd008;
            box-shadow: 0 0 10px rgba(251, 208, 8, 0.4);
        }
        #quiz-container {
            margin-top: 15px;
            border-top: 1px dashed #e5e7eb;
            padding-top: 15px;
        }
        #quiz-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }
        .quiz-option-btn {
            padding: 10px 15px;
            font-size: 13px;
            font-weight: 600;
            background: #f9fafb;
            color: #374151;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            font-family: var(--font-main);
        }
        .quiz-option-btn:hover:not(:disabled) {
            background: var(--header-yellow);
            border-color: var(--header-yellow);
            color: var(--header-dark);
            transform: translateX(4px);
        }
        .quiz-option-btn.correct {
            background: #ecfdf5;
            border-color: #10b981;
            color: #065f46;
        }
        .quiz-option-btn.incorrect {
            background: #fef2f2;
            border-color: #ef4444;
            color: #991b1b;
            text-decoration: line-through;
        }
        #quiz-feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-family: var(--font-labels);
            font-weight: 700;
            font-size: 14px;
            animation: popReveal 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .feedback-correct {
            background: #ecfdf5;
            border: 2px dashed #10b981;
            color: #065f46;
        }
        .feedback-incorrect {
            background: #fef2f2;
            border: 2px dashed #ef4444;
            color: #991b1b;
        }
        .inspect-instruction {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 20px;
            font-style: italic;
            border-top: 1px solid rgba(0,0,0,0.06);
            padding-top: 12px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        @keyframes popReveal {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        var debugLogs = [];
        function logToOverlay(type, args) {
            var msg = Array.prototype.slice.call(args).map(function(arg) {
                if (arg instanceof Error) return arg.message + "\n" + arg.stack;
                return typeof arg === 'object' ? JSON.stringify(arg) : arg;
            }).join(' ');
            debugLogs.push('[' + type + '] ' + msg);
            var logDiv = document.getElementById('debug-log-console');
            if (logDiv) {
                logDiv.style.display = 'block';
                logDiv.innerHTML += '<div class="log-' + type + '" style="margin-bottom: 5px; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 3px; color: ' + (type === 'error' ? '#db2777' : (type === 'warn' ? '#d97706' : '#1f2937')) + ';">[' + type.toUpperCase() + '] ' + msg + '</div>';
                logDiv.scrollTop = logDiv.scrollHeight;
            }
        }
        
        // Hijack console
        var _log = console.log;
        var _error = console.error;
        var _warn = console.warn;
        
        console.log = function() {
            logToOverlay('log', arguments);
            _log.apply(console, arguments);
        };
        console.error = function() {
            logToOverlay('error', arguments);
            _error.apply(console, arguments);
        };
        console.warn = function() {
            logToOverlay('warn', arguments);
            _warn.apply(console, arguments);
        };
        
        window.onerror = function(message, source, lineno, colno, error) {
            var errorMsg = message + " en " + (source ? source.split('/').pop() : 'desconocido') + ":" + lineno;
            logToOverlay('error', [errorMsg]);
            if (error && error.stack) {
                logToOverlay('error', [error.stack]);
            }
            return false;
        };
    </script>
</head>
<body>

    <script>
        // Capturar y alertar errores de script para facilitar la depuración local
        window.onerror = function(message, source, lineno, colno, error) {
            alert("Error detectado en el script:\n" + message + "\n\nArchivo: " + source + "\nLínea: " + lineno + ":" + colno + "\n\nStack:\n" + (error ? error.stack : 'No disponible'));
            return false;
        };

        // Generador de textura procedural de piso de madera
        function createWoodTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#e2d6c1';
            ctx.fillRect(0, 0, 512, 512);

            const rows = 16;
            const rowHeight = 512 / rows;
            const cols = 4;
            const colWidth = 512 / cols;

            for (let r = 0; r < rows; r++) {
                const y = r * rowHeight;

                ctx.strokeStyle = '#dfd2bd';
                ctx.lineWidth = 1;
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(0, y + Math.random() * rowHeight);
                    ctx.bezierCurveTo(
                        128, y + Math.random() * rowHeight,
                        384, y + Math.random() * rowHeight,
                        512, y + Math.random() * rowHeight
                    );
                    ctx.stroke();
                }

                ctx.strokeStyle = '#9d8e78';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(512, y);
                ctx.stroke();

                const offset = (r % 2) * (colWidth / 2);
                for (let c = 0; c <= cols + 1; c++) {
                    const x = c * colWidth - offset;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x, y + rowHeight);
                    ctx.stroke();
                }
            }

            const texture = new THREE.CanvasTexture(canvas);

            const goldMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.1, metalness: 0.9 });
            const needleMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.1, metalness: 0.95 });
            
            // 1. Ovillo de lana en la esquina de la base del pedestal
            const yarnBallGroup = new THREE.Group();
            const ballCore = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), woolMat);
            ballCore.castShadow = true;
            yarnBallGroup.add(ballCore);
            
            // Hilos cruzados envolviendo el ovillo para realismo
            for (let i = 0; i < 6; i++) {
                const strand = new THREE.Mesh(new THREE.TorusGeometry(0.305, 0.015, 6, 24), woolMat);
                strand.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                yarnBallGroup.add(strand);
            }
            yarnBallGroup.position.set(-0.45, -0.35, -0.4);
            group.add(yarnBallGroup);
            
            // 2. Cadena de Crochet Lineal (Eslabones complejos)
            const chainGroup = new THREE.Group();
            const loopDistance = 0.28;
            const numLoops = 6;
            for (let i = 0; i < numLoops; i++) {
                const loopHolder = new THREE.Group();
                
                // Eslabón base
                const ring = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.045, 8, 24), woolMat);
                ring.rotation.y = (i % 2 === 0) ? 0.25 : -0.25;
                ring.castShadow = true;
                loopHolder.add(ring);
                
                // Nudo pequeño en el enlace
                const knot = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.035, 6, 12), woolMat);
                knot.position.set(0, 0, 0.12);
                knot.rotation.x = Math.PI / 2;
                loopHolder.add(knot);
                
                loopHolder.position.set(0, -0.15, -0.7 + i * loopDistance);
                chainGroup.add(loopHolder);
            }
            group.add(chainGroup);
            
            // Hebra de lana que va del ovillo al inicio de la cadena
            const threadMat = woolMat;
            const threadJoint = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.8, 8), threadMat);
            threadJoint.rotation.set(0.4, 0, -0.8);
            threadJoint.position.set(-0.25, -0.25, -0.5);
            group.add(threadJoint);
            
            // 3. Aguja de Crochet con Mango Ergonomico de Madera y punta de latón
            const needleGroup = new THREE.Group();
            
            // Mango de madera tallada
            const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.7, 12), woodMat);
            handle.position.y = -0.3;
            handle.castShadow = true;
            needleGroup.add(handle);
            
            // Junta de metal (Collar dorado)
            const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.08, 12), goldMat);
            collar.position.y = 0.08;
            needleGroup.add(collar);
            
            // Eje metálico
            const metalShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.7, 12), needleMat);
            metalShaft.position.y = 0.43;
            metalShaft.castShadow = true;
            needleGroup.add(metalShaft);
            
            // Gancho de punta detallada
            const hookTip = new THREE.Mesh(new THREE.TorusGeometry(0.04, 0.02, 6, 12, Math.PI * 1.2), needleMat);
            hookTip.position.set(-0.02, 0.76, 0);
            hookTip.rotation.z = -0.4;
            needleGroup.add(hookTip);
            
            const hookBack = new THREE.Mesh(new THREE.ConeGeometry(0.02, 0.05, 8), needleMat);
            hookBack.position.set(-0.015, 0.78, 0);
            needleGroup.add(hookBack);
            
            needleGroup.position.set(-0.1, 0.1, 0.35);
            needleGroup.rotation.set(0.65, 0.2, -0.75);
            group.add(needleGroup);
            
            group.needle = needleGroup;
            group.chain = chainGroup;
            
            return group;
        }

        // Capturar eventos de mouse/táctil para arrastre y clic
        container.addEventListener('pointerdown', (e) => {
            pointerDownTime = Date.now();
            pointerDownPos.x = e.clientX;
            pointerDownPos.y = e.clientY;
            
            if (inspectedObject) {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        container.addEventListener('pointermove', (e) => {
            if (isDragging && inspectedObject) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                
                // Rotación manual del modelo por el usuario
                inspectedObject.rotation.y += deltaX * 0.007;
                inspectedObject.rotation.x += deltaY * 0.007;
                
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        window.addEventListener('pointerup', (e) => {
            isDragging = false;
            
            const clickDuration = Date.now() - pointerDownTime;
            const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
            
            // Si el puntero se levantó rápido y casi no se movió, es un clic válido en la escena (mayor tolerancia)
            if (clickDuration < 500 && dist < 15) {
                handleCanvasClick(e);
            }
        });

        function handleCanvasClick(event) {
            // Evitar raycasting si se hace clic en elementos de la interfaz DOM
            if (event.target.tagName === 'BUTTON' || 
                event.target.closest('#speech-bubble') || 
                event.target.closest('.top-bar') ||
                event.target.closest('#ui-container') ||
                event.target.closest('#addie-modal-overlay') ||
                event.target.closest('#quick-navigation-map')) {
                return;
            }

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);
            
            if (intersects.length > 0) {
                let hitObj = null;
                let current = intersects[0].object;
                while (current && current !== scene) {
                    if (animatingObjects.includes(current)) {
                        hitObj = current;
                        break;
                    }
                    current = current.parent;
                }
                
                if (hitObj) {
                    // Si ya estábamos inspeccionando un objeto y hacemos clic en otro,
                    // restauramos suavemente la rotación del anterior primero
                    if (inspectedObject && inspectedObject !== hitObj) {
                        const prevObj = inspectedObject;
                        gsap.to(prevObj.rotation, {
                            x: prevObj.originalRotX || 0,
                            y: prevObj.originalRotY || 0,
                            z: prevObj.originalRotZ || 0,
                            duration: 0.8
                        });
                    }
                    inspectModel(hitObj);
                }
            } else {
                // Hacer clic en el vacío de la galería sale del modo inspección
                if (inspectedObject) {
                    exitInspection();
                }
            }
        }

        let typewriterInterval = null;
        let currentStoryText = "";

        function typeText(element, text, speed, onComplete) {
            element.innerHTML = '';
            let index = 0;
            clearInterval(typewriterInterval);
            typewriterInterval = setInterval(() => {
                if (index < text.length) {
                    element.innerHTML += text.charAt(index);
                    index++;
                } else {
                    clearInterval(typewriterInterval);
                    if (onComplete) onComplete();
                }
            }, speed);
        }

        function startStorytelling(info) {

            const skipBtn = document.getElementById('skip-speech-btn');
            const revealBtn = document.getElementById('reveal-technique-btn');

            skipBtn.style.display = 'inline-block';
            revealBtn.style.display = 'none';
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('quiz-feedback').style.display = 'none';
            textElement.innerHTML = '';
            
            typeText(textElement, currentStoryText, 25, () => {
                skipBtn.style.display = 'none';
                revealBtn.style.display = 'inline-block';
            });

            quizFeedback.innerHTML = '';
            quizOptions.innerHTML = '';

            shuffledOptions.forEach(opt => {

        function submitAnswer(clickedBtn, selectedOption, correctOption) {

            if (selectedOption === correctOption) {
                clickedBtn.classList.add('correct');

                quizFeedback.innerHTML = '🎉 😊 ¡Excelente! ¡Respuesta Correcta! Soy la técnica de <strong>' + correctOption + '</strong>.';

            } else {

                clickedBtn.disabled = true;
                
                quizFeedback.className = 'feedback-incorrect';
                quizFeedback.innerHTML = '😢 ❌ ¡Oh, no es esa! Inténtalo de nuevo...';
                quizFeedback.style.display = 'block';
            }
        }

        function inspectModel(obj) {
            inspectedObject = obj;
            
            // Ocultar panel de información normal del recorrido para centrar atención
            infoPanel.style.opacity = '0';
            
            // Posicionar la cámara para un primer plano del modelo
            let offsetDistance = 4.0;
            let targetCamX = obj.position.x;
            let targetCamZ = obj.position.z;
            
            if (obj.position.x < -15) {
                // Pared izquierda (x = -25)
                targetCamX = obj.position.x + offsetDistance;
            } else if (obj.position.x > 15) {
                // Pared derecha (x = 25)
                targetCamX = obj.position.x - offsetDistance;
            } else {
                // Pared de fondo (z = -25)
                targetCamZ = obj.position.z + offsetDistance;
            }
            
            // Aplanar flotación
            gsap.to(obj.position, {
                y: obj.baseY,
                duration: 0.8
            });
            
            // Animar cámara al primer plano del objeto
            gsap.to(animState, {
                camX: targetCamX,
                camY: obj.baseY + 0.2,
                camZ: targetCamZ,
                lookX: obj.position.x,
                lookY: obj.baseY,
                lookZ: obj.position.z,
                duration: 1.5,
                ease: "power2.out",
                onComplete: () => {
                    // Mostrar la tarjeta con la descripción
                    showInspectionCard(obj.id);
                }
            });
        }

        function updateActiveMapNode(index) {
            const btns = document.querySelectorAll('.map-btn');

        function updateTour(index, customDuration = 2.5, autoShowBubble = true) {
            const step = tourSteps[index];

            // Actualizar interfaz de usuario
            document.getElementById('counter').innerText = step.stepLabel;
            document.getElementById('tour-title').innerText = step.title;
            document.getElementById('tour-desc').innerText = step.desc;

            prevBtn.disabled = index === 0;
            homeBtn.disabled = index === 0;
            nextBtn.disabled = index === tourSteps.length - 1;

            // Sincronizar el nodo activo en el mapa de navegación
            updateActiveMapNode(index);

            // Si el índice es mayor a 0, mostramos automáticamente el bocadillo de diálogo de la obra actual.
            // Si el índice es 0, ocultamos el bocadillo de diálogo.
            if (index === 0) {
                clearInterval(typewriterInterval);
                document.getElementById('speech-bubble').classList.remove('active');
                if (inspectedObject) {
                    const prevObj = inspectedObject;
                    inspectedObject = null;
                    gsap.to(prevObj.rotation, {
                        x: prevObj.originalRotX || 0,
                        y: prevObj.originalRotY || 0,
                        z: prevObj.originalRotZ || 0,
                        duration: 0.8
                    });
                }
            } else {
                if (inspectedObject && inspectedObject.id !== index) {
                    const prevObj = inspectedObject;
                    inspectedObject = null;
                    gsap.to(prevObj.rotation, {
                        x: prevObj.originalRotX || 0,
                        y: prevObj.originalRotY || 0,
                        z: prevObj.originalRotZ || 0,
                        duration: 0.8
                    });
                }
                if (autoShowBubble) {
                    showInspectionCard(index);
                }
            }

            // Animamos las propiedades de animState en lugar del objeto THREE directamente.
            // Esto es 100% inmune a las restricciones de inicialización del renderer de Three.js y es compatible con cualquier navegador local.
            gsap.to(animState, {
                camX: step.cameraPos.x,
                camY: step.cameraPos.y,
                camZ: step.cameraPos.z,
                lookX: step.lookAt.x,
                lookY: step.lookAt.y,
                lookZ: step.lookAt.z,
                duration: customDuration,
                ease: "power2.inOut"
            });
        }

        nextBtn.addEventListener('click', () => {

        prevBtn.addEventListener('click', () => {
            if (currentStep > 0) {

        homeBtn.addEventListener('click', () => {

                updateTour(0);

        // --- 8. BUCLE DE ANIMACIÓN Y RENDERIZADO ---
        function animate() {
            requestAnimationFrame(animate);
            
            // Sincronización continua de la cámara con el estado animado por GSAP
            if (typeof camera !== 'undefined') {
                camera.position.set(animState.camX, animState.camY, animState.camZ);
                camera.lookAt(new THREE.Vector3(animState.lookX, animState.lookY, animState.lookZ));
            }
            
            // Animación de las esculturas 3D flotantes y giratorias
            const time = Date.now() * 0.0015;
            animatingObjects.forEach(obj => {
                // Solo rotar y flotar si NO se está inspeccionando el modelo
                if (obj !== inspectedObject) {
                    obj.rotation.y += 0.01;
                    obj.position.y = obj.baseY + Math.sin(time + obj.floatPhase) * 0.1;
                }
                
                // Sub-animaciones internas detalladas por tipo de escultura
                if (obj.id === 1 && obj.ring1 && obj.ring2 && obj.outerShell && obj.shards) {
                    obj.ring1.rotation.y += 0.02;
                    obj.ring2.rotation.z += 0.03;
                    obj.outerShell.rotation.y -= 0.01;
                    obj.outerShell.rotation.x += 0.005;
                    obj.shards.rotation.y += 0.008;
                    obj.shards.position.y = Math.sin(time * 2) * 0.06;
                }
                if (obj.id === 2 && obj.visor && obj.antTip) {
                    obj.visor.material.emissiveIntensity = 2.0 + Math.sin(time * 5) * 0.6;
                    obj.antTip.material.emissiveIntensity = 1.5 + Math.sin(time * 10) * 0.8;
                }
                if (obj.id === 3 && obj.sketchGroup && obj.ribbon) {
                    obj.sketchGroup.position.y = 0.25 + Math.sin(time * 2) * 0.06;
                    obj.sketchGroup.rotation.y += 0.012;
                    obj.ribbon.rotation.x = 0.4 + Math.sin(time * 1.5) * 0.05;
                }
                if (obj.id === 4 && obj.needle && obj.chain) {
                    obj.needle.position.y = 0.1 + Math.sin(time * 2.5) * 0.12;
                    obj.needle.rotation.x = 0.65 + Math.cos(time * 2.5) * 0.08;
                    obj.chain.position.z = -0.1 + Math.sin(time * 0.5) * 0.02;
                }
                if (obj.id === 5 && obj.disc && obj.needle) {
                    obj.disc.rotation.y += 0.005;
                    obj.needle.position.x = Math.cos(time * 1.5) * 0.38;
                    obj.needle.position.z = 0.15 + Math.sin(time * 1.5) * 0.38;
                    obj.needle.rotation.y = -time * 1.5;
                }
                if (obj.id === 6 && obj.layerBG && obj.layerFlower && obj.layerTitle) {
                    obj.layerBG.position.z = 0.12 + Math.sin(time * 1.2) * 0.04;
                    obj.layerFlower.position.z = 0.32 + Math.sin(time * 1.2) * 0.08;
                    obj.layerTitle.position.z = 0.52 + Math.sin(time * 1.2) * 0.12;
                    obj.layerFlower.rotation.y += 0.015;
                }
                if (obj.id === 7 && obj.quill && obj.writings) {
                    const writePhase = time * 3;
                    obj.quill.position.x = 0.12 + Math.sin(writePhase) * 0.12;
                    obj.quill.position.y = 0.32 + Math.cos(writePhase * 2) * 0.05;
                    obj.quill.rotation.z = -0.45 + Math.sin(writePhase) * 0.08;
                    obj.writings.children.forEach((stroke, idx) => {
                        if (stroke.material) {
                            stroke.material.emissiveIntensity = 1.5 + Math.sin(time * 4 - idx) * 0.4;
                        }
                    });
                }
                if (obj.id === 8 && obj.cassette && obj.reelL && obj.reelR && obj.waves && obj.visualizerBars) {
                    obj.reelL.rotation.y += 0.03;
                    obj.reelR.rotation.y += 0.03;
                    obj.waves.children.forEach((wave, idx) => {
                        wave.scale.setScalar(1.0 + Math.sin(time * 4 - idx * 0.8) * 0.15);
                    });
                    obj.visualizerBars.forEach((bar, idx) => {
                        const scaleY = 0.3 + Math.sin(time * 6 + idx * 1.2) * 0.7;
                        bar.scale.y = Math.max(0.1, scaleY);
                    });
                }
            });
            
            renderer.render(scene, camera);
        }
        animate();

        // Inicializar el recorrido directamente en el Paso 0 (Gran Sala de Exhibición)
        updateTour(0, 0);

        // --- FUNCIONES DEL MODAL DE DISEÑO DE RECURSO ---
        function openAddieModal() {
            const iframe = document.querySelector('.addie-modal-body iframe');
            if (iframe) {
                iframe.src = `diseno_capsula_introductoria.html`;
            }
            document.getElementById('addie-modal-overlay').classList.add('active');
        }

        function closeAddieModal() {
            document.getElementById('addie-modal-overlay').classList.remove('active');
        }

        function closeAddieModalOnOverlay(event) {
            if (event.target.id === 'addie-modal-overlay') {
                closeAddieModal();
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
